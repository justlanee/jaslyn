<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 340" width="320" height="340">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e0b24" />
      <stop offset="50%" stop-color="#2c0d30" />
      <stop offset="100%" stop-color="#120517" />
    </linearGradient>
    <linearGradient id="visorGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#ff66b2" />
    </linearGradient>
    <pattern id="scanlines" width="4" height="4" patternUnits="userSpaceOnUse">
      <rect width="4" height="2" fill="rgba(0, 0, 0, 0.28)" />
    </pattern>
  </defs>

  <!-- Deep Plum Retro Backdrop -->
  <rect width="320" height="340" fill="url(#bgGrad)" />

  <!-- Subtle Pixel Grid -->
  <g stroke="rgba(216, 132, 168, 0.12)" stroke-width="1">
    <line x1="0" y1="60" x2="320" y2="60" />
    <line x1="0" y1="120" x2="320" y2="120" />
    <line x1="0" y1="180" x2="320" y2="180" />
    <line x1="0" y1="240" x2="320" y2="240" />
    <line x1="0" y1="300" x2="320" y2="300" />
    <line x1="64" y1="0" x2="64" y2="340" />
    <line x1="128" y1="0" x2="128" y2="340" />
    <line x1="192" y1="0" x2="192" y2="340" />
    <line x1="256" y1="0" x2="256" y2="340" />
  </g>

  <!-- Ambient Bubbles -->
  <circle cx="48" cy="70" r="10" fill="none" stroke="#5ef2ff" stroke-width="1.5" opacity="0.55" />
  <circle cx="52" cy="66" r="2.5" fill="#5ef2ff" opacity="0.7" />
  <circle cx="272" cy="95" r="14" fill="none" stroke="#ff79c6" stroke-width="1.5" opacity="0.5" />
  <circle cx="266" cy="89" r="3" fill="#ff79c6" opacity="0.7" />
  <circle cx="255" cy="52" r="6" fill="none" stroke="#5ef2ff" stroke-width="1.2" opacity="0.45" />

  <!-- Stylized Retro Developer Avatar Silhouette -->
  <!-- Shoulders / Hoodie -->
  <path d="M56 320 C56 244, 102 224, 160 224 C218 224, 264 244, 264 320 Z" fill="#3b153e" stroke="#d884a8" stroke-width="3" />
  <path d="M126 226 L160 272 L194 226" fill="none" stroke="#5ef2ff" stroke-width="2" />

  <!-- Head -->
  <rect x="112" y="102" width="96" height="104" rx="18" fill="#4f1c4d" stroke="#f3a6c8" stroke-width="3" />

  <!-- Headphones -->
  <rect x="96" y="128" width="16" height="48" rx="4" fill="#ff66b2" stroke="#18071b" stroke-width="2" />
  <rect x="208" y="128" width="16" height="48" rx="4" fill="#ff66b2" stroke="#18071b" stroke-width="2" />
  <path d="M104 128 C104 78, 216 78, 216 128" fill="none" stroke="#d884a8" stroke-width="6" />

  <!-- Cyber/Retro Visor Glasses -->
  <rect x="124" y="136" width="72" height="24" rx="3" fill="url(#visorGrad)" stroke="#ffffff" stroke-width="1.5" />
  <line x1="132" y1="142" x2="152" y2="142" stroke="#ffffff" stroke-width="2" opacity="0.85" />

  <!-- Subtle Smile -->
  <path d="M148 180 Q160 188 172 180" fill="none" stroke="#ffd1e8" stroke-width="2.5" stroke-linecap="round" />

  <!-- Mini Pixel Clownfish Companion -->
  <g transform="translate(215, 250)">
    <ellipse cx="28" cy="16" rx="20" ry="11" fill="#ff6b2b" stroke="#fff2e6" stroke-width="1.5" />
    <path d="M22 6 Q24 16 22 26" stroke="#ffffff" stroke-width="4" fill="none" />
    <path d="M33 7 Q35 16 33 25" stroke="#ffffff" stroke-width="3.5" fill="none" />
    <polygon points="46,16 58,8 56,24" fill="#ff6b2b" stroke="#fff2e6" stroke-width="1.2" />
    <circle cx="15" cy="14" r="2.2" fill="#120517" />
  </g>

  <!-- Scanline Overlay -->
  <rect width="320" height="340" fill="url(#scanlines)" />

  <!-- Bottom Label Banner -->
  <rect x="14" y="294" width="292" height="32" fill="rgba(16, 5, 20, 0.86)" stroke="#d884a8" stroke-width="1.5" />
  <text x="160" y="314" fill="#ff94c8" font-family="monospace" font-size="11" text-anchor="middle" font-weight="bold">
    REPLACE: /public/assets/me.jpg
  </text>
</svg>
