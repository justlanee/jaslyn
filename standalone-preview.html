      function renderHighlightedText(text, highlights) {
        if (!highlights || !highlights.length) return text;
        const escaped = highlights.map((h) => h.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
        const regex = new RegExp(`(${escaped.join('|')})`, 'gi');
        return text.split(regex).map((part, idx) =>
          highlights.some((h) => h.toLowerCase() === part.toLowerCase()) ? (
            <strong key={idx} className="bio-highlight">{part}</strong>
          ) : (
            <React.Fragment key={idx}>{part}</React.Fragment>
          )
        );
      }

          onMouseDown={() => onFocus(id)}

                      >
                        YT ↗
                      </a>
                    </div>
                    <div className="music-player__track-panel">
                      <div className="music-player__track-meta">
                        <span className="music-player__track-title">{portfolioData.audioTrack.title}</span>
                        <span className="music-player__time">
                          {formatTime(currentTimeSec)} / {formatTime(durationSec)}
                        </span>
                      </div>
                      <div className="music-player__progress-rail">
                        <div className="music-player__progress-fill" style={{ width: `${musicProgress}%` }} />
                      </div>
                    </div>
                  </div>
                </WindowFrame>
              )}

              <main className="retro-desktop__workspace">
                <aside className="retro-desktop__sidebar">
                  {windows.quicklinks.isOpen && (
                    <WindowFrame
                      id="quicklinks"
                      title="QUICK_LINKS.EXE"
                      {...windows.quicklinks}
                      isFocused={focusedWindow === 'quicklinks'}
                      onFocus={setFocusedWindow}
                      onMinimize={toggleMinimize}
                      onMaximize={toggleMaximize}
                      onClose={closeWin}
                      statusBar={
                        <div className="retro-status-row">
                          <span>{portfolioData.quickLinks.length} shortcuts</span>
                          <span className="retro-status-online"><span className="status-led status-led--online" /> LINK_OK</span>
                        </div>
                      }
                    >
                      <ul className="quicklinks-list">
                        {portfolioData.quickLinks.map((item) => (
                          <li key={item.id}>
                            <a href={item.url} target="_blank" rel="noopener noreferrer" className="quicklink-btn">
                              <span className="quicklink-btn__badge" style={{ backgroundColor: item.badgeColor }}>{item.badge}</span>
                              <span className="quicklink-btn__label">{item.label}</span>
                            </a>
                          </li>
                        ))}
                      </ul>
                    </WindowFrame>
                  )}

                  {windows.opensource.isOpen && (
                    <WindowFrame
                      id="opensource"
                      title="OPEN_SOURCE.EXE"
                      {...windows.opensource}
                      isFocused={focusedWindow === 'opensource'}
                      onFocus={setFocusedWindow}
                      onMinimize={toggleMinimize}
                      onMaximize={toggleMaximize}
                      onClose={closeWin}
                      className="opensource-window"
                      statusBar={
                        <div className="retro-status-row">
                          <span>{filteredOS.length} projects mounted</span>
                          <span>@justlanee</span>
                        </div>
                      }
                    >
                      <ul className="os-list">
                        {filteredOS.map((repo) => (
                          <li key={repo.id} className="os-card">
                            <div className="os-card__header">
                              <span>📁</span>
                              <a href={repo.repoUrl} target="_blank" rel="noopener noreferrer" className="os-card__title-link">
                                {repo.name}
                              </a>
                            </div>
                            <p className="os-card__desc">{repo.description}</p>
                            <div className="os-card__tags">
                              {repo.tags.map((t) => <span key={t} className="retro-mini-tag">{t}</span>)}
                            </div>
                          </li>
                        ))}
                      </ul>
                    </WindowFrame>
                  )}
                </aside>

                <div className="retro-desktop__stage">
                  <WindowFrame
                    id={activeSection}
                    title={`${activeSection.toUpperCase()}.EXE`}
                    {...windows[activeSection]}
                    canClose={activeSection !== 'home'}
                    isFocused={focusedWindow === activeSection}
                    onFocus={setFocusedWindow}
                    onMinimize={toggleMinimize}
                    onMaximize={toggleMaximize}
                    onClose={closeWin}
                    className="main-stage-window"
                    statusBar={
                      <div className="retro-status-row">
                        <span>USER: JASLYN KAYE TORRES</span>
                        <span>LOC: MARIKINA, PHILIPPINES</span>
                        <span className="retro-status-online"><span className="status-led status-led--online" /> ONLINE</span>
                      </div>
                    }
                  >
                    {activeSection === 'home' && (
                      <div className="home-grid">
                        <div className="home-grid__left">
                          <div className="identity-header">
                            <span className="identity-header__handle">{portfolioData.profile.handle}</span>
                            <h1 className="identity-header__name">{portfolioData.profile.name}</h1>
                            <p className="identity-header__tagline">{portfolioData.profile.tagline}</p>
                          </div>
                          <div className="image-viewer">
                            <div className="image-viewer__titlebar">
                              <span className="image-viewer__title">IMAGE_VIEWER.EXE - [{currentPhoto.fileName}]</span>
                              <div className="image-viewer__toolbar">
                                <button type="button" className="retro-mini-icon-btn" onClick={() => setPhotoIdx((i) => (i - 1 + photos.length) % photos.length)} title="Previous Photo">◄</button>
                                <button type="button" className="retro-mini-icon-btn" onClick={() => setPhotoIdx((i) => (i + 1) % photos.length)} title="Next Photo">►</button>
                                <button type="button" className="retro-mini-icon-btn" onClick={() => setZoom((z) => Math.max(75, z - 25))}>-</button>
                                <button type="button" className="retro-mini-icon-btn" onClick={() => setZoom(100)}>1:1</button>
                                <button type="button" className="retro-mini-icon-btn" onClick={() => setZoom((z) => Math.min(150, z + 25))}>+</button>
                              </div>
                            </div>
                            <div className="image-viewer__viewport">
                              <img
                                src={currentPhoto.url}
                                alt={currentPhoto.caption}
                                className="image-viewer__img"
                                style={{ transform: `scale(${zoom / 100})` }}
                              />
                            </div>
                            <div className="image-viewer__statusbar">
                              <span>FILE: {currentPhoto.fileName} ({photoIdx + 1}/{photos.length})</span>
                              <span>ZOOM: {zoom}%</span>
                              <span className="retro-status-online"><span className="status-led status-led--online" /> ONLINE</span>
                            </div>
                          </div>

                          <div className="identity-actions">
                            <button type="button" className="retro-btn retro-btn--primary" onClick={() => setActiveSection('projects')}>
                              OPEN PROJECTS.EXE ↗
                            </button>
                            <button type="button" className="retro-btn" onClick={() => setActiveSection('resume')}>
                              RESUME.EXE
                            </button>
                            <button type="button" className="retro-btn" onClick={() => setActiveSection('contact')}>
                              CONTACT
                            </button>
                          </div>
                        </div>

                        <div className="home-grid__right">
                          <article className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">{portfolioData.profile.bioTitle}</span>
                              <span className="retro-subpanel__code">BIO_README.TXT</span>
                            </div>
                            <div className="retro-subpanel__content">
                              {portfolioData.profile.bioParagraphs.map((p, i) => (
                                <p key={i} className="bio-panel__paragraph">{renderHighlightedText(p.text, p.highlights)}</p>
                              ))}
                              {portfolioData.profile.goals && (
                                <p className="bio-panel__goals">
                                  <strong className="bio-highlight">Objective:</strong> {portfolioData.profile.goals}
                                </p>
                              )}
                              <div className="focus-section">
                                <span className="focus-section__label">Focus:</span>
                                <div className="focus-section__tags">
                                  {portfolioData.profile.focusAreas.map((f) => (
                                    <span key={f} className="cyan-focus-tag">{f}</span>
                                  ))}
                                </div>
                              </div>
                            </div>
                          </article>

                          <article className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">Experience & Capstone Leadership</span>
                              <span className="retro-subpanel__code">EXP_LOG.DAT</span>
                            </div>
                            <div className="retro-subpanel__content">
                              {portfolioData.experience.map((exp) => (
                                <div key={exp.id} className="timeline-item">
                                  <div className="timeline-item__top">
                                    <h3 className="timeline-item__role">{exp.role}</h3>
                                    <span className="timeline-item__period">{exp.period}</span>
                                  </div>
                                  <div className="timeline-item__meta">{exp.organization} • {exp.location}</div>
                                  <ul className="timeline-item__bullets">
                                    {exp.highlights.map((h, i) => <li key={i}>{h}</li>)}
                                  </ul>
                                </div>
                              ))}
                            </div>
                          </article>

                          <article className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">Education</span>
                              <span className="retro-subpanel__code">EDU_SYS.INI</span>
                            </div>
                            <div className="retro-subpanel__content">
                              {portfolioData.education.map((edu) => (
                                <div key={edu.id} className="timeline-item">
                                  <div className="timeline-item__top">
                                    <h3 className="timeline-item__role">{edu.degree}</h3>
                                    <span className="timeline-item__period">{edu.period}</span>
                                  </div>
                                  <div className="timeline-item__meta">{edu.institution} • {edu.location}</div>
                                  <p className="timeline-item__desc">{edu.details}</p>
                                </div>
                              ))}
                            </div>
                          </article>

                          <article className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">Technical Skills Overview</span>
                              <button type="button" className="retro-inline-link" onClick={() => setActiveSection('techstack')}>
                                Open TECHSTACK.EXE →
                              </button>
                            </div>
                            <div className="retro-subpanel__content">
                              <div className="skills-mini-grid">
                                {portfolioData.techStack.map((cat) => (
                                  <div key={cat.id} className="skills-mini-group">
                                    <span className="skills-mini-group__title">{cat.category}:</span>
                                    <div className="skills-mini-group__chips">
                                      {cat.skills.map((s) => (
                                        <span key={s.name} className="retro-mini-tag">{s.name}</span>
                                      ))}
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </div>
                          </article>
                        </div>
                      </div>
                    )}

                    {activeSection === 'projects' && (
                      <div>
                        <div className="section-toolbar">
                          <span className="section-toolbar__title">PROJECTS.EXE // CAPSTONE, SOFTWARE & HARDWARE BUILDS</span>
                          <button type="button" className="retro-btn" onClick={() => setActiveSection('home')}>← Back to HOME.EXE</button>
                        </div>
                        <div className="projects-grid">
                          {filteredProjects.map((project) => {
                            const isInProgress = project.status === 'IN_PROGRESS';
                            return (
                              <article key={project.id} className="project-card">
                                <header className="project-card__header">
                                  <div>
                                    <span className="project-card__category">
                                      {project.category}
                                      {project.role ? ` • Role: ${project.role}` : ''}
                                    </span>
                                    <h3 className="project-card__title">{project.title}</h3>
                                  </div>
                                  <span
                                    className="project-card__status"
                                    style={isInProgress ? { color: '#ffe066' } : undefined}
                                  >
                                    <span className={`status-led ${isInProgress ? 'status-led--warn' : 'status-led--online'}`} />
                                    {isInProgress ? 'IN PROGRESS' : project.status}
                                  </span>
                                </header>
                                <p className="project-card__desc">{project.description}</p>
                                <div className="project-card__tech">
                                  {project.technologies.map((t) => <span key={t} className="cyan-focus-tag">{t}</span>)}
                                </div>
                                <footer className="project-card__actions">
                                  {project.repoUrl ? (
                                    <a href={project.repoUrl} target="_blank" rel="noopener noreferrer" className="retro-btn retro-btn--primary">
                                      GitHub Repository ↗
                                    </a>
                                  ) : isInProgress ? (
                                    <span className="retro-mini-tag" style={{ borderColor: '#ffe066', color: '#ffe066' }}>
                                      Active Capstone Build (A.Y. 2026–2027)
                                    </span>
                                  ) : (
                                    <span className="retro-mini-tag">Hardware / Lab Prototype</span>
                                  )}
                                </footer>
                              </article>
                            );
                          })}
                        </div>
                      </div>
                    )}

                    {activeSection === 'techstack' && (
                      <div>
                        <div className="section-toolbar">
                          <span className="section-toolbar__title">TECHSTACK.EXE // LANGUAGES, DATABASE (DBA), MICROCONTROLLERS & PCB</span>
                          <button type="button" className="retro-btn" onClick={() => setActiveSection('home')}>← Back to HOME.EXE</button>
                        </div>
                        <div className="techstack-grid">
                          {portfolioData.techStack.map((group) => (
                            <section key={group.id} className="retro-subpanel">
                              <header className="retro-subpanel__header">
                                <h3 className="retro-subpanel__title">{group.category}</h3>
                                <span className="retro-subpanel__code">{group.code}</span>
                              </header>
                              <div className="retro-subpanel__content tech-skill-list">
                                {group.skills.map((skill) => (
                                  <div key={skill.name} className="tech-skill-item">
                                    <div className="tech-skill-item__main">
                                      <span className="tech-skill-item__bullet">▸</span>
                                      <span className="tech-skill-item__name">{skill.name}</span>
                                    </div>
                                    <div className="tech-skill-item__badges">
                                      <span className="retro-mini-tag">{skill.tag}</span>
                                      <span className="tech-skill-item__level">{skill.level}</span>
                                    </div>
                                  </div>
                                ))}
                              </div>
                            </section>
                          ))}
                        </div>
                      </div>
                    )}

                    {activeSection === 'resume' && (
                      <div>
                        <div className="section-toolbar">
                          <div className="section-toolbar__filters">
                            <a href={portfolioData.resume.pdfUrl} download={portfolioData.resume.fileName} className="retro-btn retro-btn--primary">
                              Download Resume PDF
                            </a>
                            <a href={portfolioData.resume.pdfUrl} target="_blank" rel="noopener noreferrer" className="retro-btn">
                              Open Original PDF ↗
                            </a>
                            <button type="button" className="retro-btn" onClick={() => setShowPdfEmbed((prev) => !prev)}>
                              {showPdfEmbed ? 'Show Formatted CV' : 'Embed PDF Preview'}
                            </button>
                          </div>
                          <button type="button" className="retro-btn" onClick={() => setActiveSection('home')}>← Back to HOME.EXE</button>
                        </div>
                        {showPdfEmbed ? (
                          <div className="resume-embed-container">
                            <object data={portfolioData.resume.pdfUrl} type="application/pdf" className="resume-embed-object">
                              <p>Open <a href={portfolioData.resume.pdfUrl}>resume.pdf</a></p>
                            </object>
                          </div>
                        ) : (
                          <div className="resume-sheet">
                            <header className="resume-sheet__header">
                              <div>
                                <h3 className="resume-sheet__name">{portfolioData.profile.name}</h3>
                                <p className="resume-sheet__tagline">{portfolioData.profile.tagline}</p>
                              </div>
                              <div className="resume-sheet__meta">
                                <span>📍 {portfolioData.contact.location}</span>
                                <span>✉️ {portfolioData.contact.email}</span>
                                <span>📱 {portfolioData.contact.phone}</span>
                                <span>🔗 github.com/justlanee</span>
                              </div>
                            </header>
                            <section className="resume-sheet__section">
                              <h4 className="resume-sheet__section-title">EDUCATION</h4>
                              {portfolioData.education.map((edu) => (
                                <div key={edu.id} className="resume-sheet__item">
                                  <div className="resume-sheet__row">
                                    <strong>{edu.degree}</strong>
                                    <span>{edu.period}</span>
                                  </div>
                                  <div className="resume-sheet__sub">{edu.institution} • {edu.location}</div>
                                </div>
                              ))}
                            </section>
                            <section className="resume-sheet__section">
                              <h4 className="resume-sheet__section-title">EXPERIENCE & CAPSTONE ROLE</h4>
                              {portfolioData.experience.map((exp) => (
                                <div key={exp.id} className="resume-sheet__item">
                                  <div className="resume-sheet__row">
                                    <strong>{exp.role}</strong>
                                    <span>{exp.period}</span>
                                  </div>
                                  <ul className="timeline-item__bullets">
                                    {exp.highlights.map((h, i) => <li key={i}>{h}</li>)}
                                  </ul>
                                </div>
                              ))}
                            </section>
                          </div>
                        )}
                      </div>
                    )}

                    {activeSection === 'contact' && (
                      <div>
                        <div className="section-toolbar">
                          <span className="section-toolbar__title">CONTACT.EXE // DIRECT TRANSMISSION</span>
                          <button type="button" className="retro-btn" onClick={() => setActiveSection('home')}>← Back to HOME.EXE</button>
                        </div>
                        <div className="contact-layout">
                          <aside className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">Coordinates</span>
                              <span className="retro-subpanel__code">NET_ADDR.CFG</span>
                            </div>
                            <div className="retro-subpanel__content contact-info-list">
                              <div className="contact-info-item">
                                <span className="contact-info-item__label">EMAIL</span>
                                <a href={`mailto:${portfolioData.contact.email}`} className="contact-info-item__link">{portfolioData.contact.email}</a>
                              </div>
                              <div className="contact-info-item">
                                <span className="contact-info-item__label">MOBILE</span>
                                <a href={`tel:${portfolioData.contact.phone}`} className="contact-info-item__link">{portfolioData.contact.phone}</a>
                              </div>
                              <div className="contact-info-item">
                                <span className="contact-info-item__label">LOCATION</span>
                                <span className="contact-info-item__val">{portfolioData.contact.location}</span>
                              </div>
                              <div className="contact-info-item">
                                <span className="contact-info-item__label">SOCIALS</span>
                                <div className="contact-info-links">
                                  <a href={portfolioData.contact.githubUrl} target="_blank" rel="noopener noreferrer" className="retro-btn">GitHub ↗</a>
                                  <a href={portfolioData.contact.instagramUrl} target="_blank" rel="noopener noreferrer" className="retro-btn">Instagram ↗</a>
                                  <a href={portfolioData.contact.facebookUrl} target="_blank" rel="noopener noreferrer" className="retro-btn">Facebook ↗</a>
                                </div>
                              </div>
                            </div>
                          </aside>
                          <section className="retro-subpanel">
                            <div className="retro-subpanel__header">
                              <span className="retro-subpanel__title">Send Email</span>
                              <span className="retro-subpanel__code">MAILTO.EXE</span>
                            </div>
                            <div className="retro-subpanel__content">
                              <p className="bio-panel__paragraph">Click below to compose a direct email to <strong>{portfolioData.contact.email}</strong>:</p>
                              <a href={`mailto:${portfolioData.contact.email}`} className="retro-btn retro-btn--primary">
                                Compose Email to Jaslyn Kaye Torres ↗
                              </a>
                            </div>
                          </section>
                        </div>
                      </div>
                    )}
                  </WindowFrame>
                </div>
              </main>
            </div>
          </div>
        );
      };

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>
